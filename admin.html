
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | EL CLOSET DE ANTO</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin.js" defer></script>
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo">EL CLOSET DE ANTO</a>
    <p class="tagline">Panel de administración</p>
  </header>

  <main class="admin-container">
    <section id="loginSection">
      <h1>Bienvenida, Anto</h1>
      <p>Ingresa para administrar tu tienda.</p>

      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" required autocomplete="username">

        <label for="password">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password">

        <button class="btn-primary" type="submit">
          INICIAR SESIÓN
        </button>
      </form>

      <p id="loginMessage" role="alert"></p>
    </section>

    <section id="dashboardSection" hidden>
      <h1>Administrar productos</h1>
      <p>Gestiona la colección de tu boutique.</p>

      <button id="logoutButton" class="btn-primary" type="button">
        CERRAR SESIÓN
      </button>

      <form id="productForm">
        <input type="hidden" id="productId">

        <label for="name">Nombre de la prenda</label>
        <input id="name" type="text" required>

        <label for="price">Precio USD</label>
        <input id="price" type="number" min="0" step="0.01" required>

        <label for="category">Categoría</label>
        <input id="category" type="text" required>

        <label for="sizes">Tallas disponibles</label>
        <input id="sizes" type="text" placeholder="S, M, L, XL">

        <label for="description">Descripción</label>
        <textarea id="description"></textarea>

        <label for="photo">Fotografía</label>
        <input id="photo" type="file" accept="image/*">

        <button class="btn-primary" type="submit">
          GUARDAR PRODUCTO
        </button>

        <button id="cancelEdit" type="button">
          CANCELAR EDICIÓN
        </button>

        <p id="productMessage" role="status"></p>
      </form>

      <h2>Productos registrados</h2>
      <div id="adminProducts"></div>
    </section>
  </main>
</body>
</html>
